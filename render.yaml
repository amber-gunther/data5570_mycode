databases:
  - name: freshtrack-db
    plan: free
    databaseName: freshtrack
    user: freshtrack

services:
  - type: web
    plan: free
    name: freshtrack
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "cd backend && python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --workers 1"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHONPATH
        value: backend
      - key: DATABASE_URL
        fromDatabase:
          name: freshtrack-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "1"
